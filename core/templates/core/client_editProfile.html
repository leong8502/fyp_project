{% extends 'core/client_master.html' %}
{% load static %}
{% block title %}Edit Profile{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/css/client_editProfile.css' %}">
{% endblock %}

{% block content %}

<div class="container">
    <div class="banner-section">
        <img src="{% if user.client.background_image %}{{ user.client.background_image.url }}{% else %}https://via.placeholder.com/1200x400?text=Profile+Background+Image{% endif %}"
            alt="Profile Background" class="banner">
        <div class="profile-image-wrapper">
            <img src="{% if user.client.profile_image %}{{ user.client.profile_image.url }}{% else %}https://via.placeholder.com/150?text=Profile+Image{% endif %}"
                alt="Profile Image" class="profile-image">
        </div>
    </div>
    <div class="content">
        <h1 id="title-display">Edit Profile</h1>

        <form id="profile-form" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Banner and Profile Image Uploads -->
            <div>
                <label>Profile Background Image (Banner)</label>
                <input type="file" accept="image/*" id="background-image-upload" name="background_image">
            </div>
            <div>
                <label>Profile Image</label>
                <input type="file" accept="image/*" id="profile-image-upload" name="profile_image">
            </div>

            <!-- Basic Info -->
            <div>
                <label for="name">Company Name</label>
                <input type="text" id="name" name="company_name" value="{{ user.client.company_name }}">
            </div>
            <div>
                <label for="tagline">Tagline</label>
                <input type="text" id="tagline" name="tagline" value="{{ user.client.tagline }}"
                    placeholder="e.g. Innovative Software Solutions for the Modern Enterprise">
            </div>
            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description">{{ user.client.description }}</textarea>
            </div>

            <!-- Contact Info -->
            <div>
                <label for="phone">Phone No</label>
                <input type="tel" id="phone" name="phone" value="{{ user.client.phone }}" placeholder="+1 234 567 890">
            </div>
            <div>
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="{{ user.client.address }}"
                    placeholder="Street, City, Country">
            </div>

            <!-- Company Specific -->
            <div>
                <label for="industry">Industry Type</label>
                <input type="text" id="industry" name="industry_type" value="{{ user.client.industry_type }}"
                    placeholder="e.g., Technology, Finance">
            </div>
            <div>
                <label for="company-size">Company Size</label>
                <select id="company-size" name="company_size">
                    <option value="">Select...</option>
                    <option value="1-10" {% if user.client.company_size == "1-10" %}selected{% endif %}>1-10</option>
                    <option value="11-50" {% if user.client.company_size == "11-50" %}selected{% endif %}>11-50</option>
                    <option value="51-200" {% if user.client.company_size == "51-200" %}selected{% endif %}>51-200
                    </option>
                    <option value="201-500" {% if user.client.company_size == "201-500" %}selected{% endif %}>201-500
                    </option>
                    <option value="500+" {% if user.client.company_size == "500+" %}selected{% endif %}>500+</option>
                </select>
            </div>
            <div>
                <label for="year-founded">Year Founded</label>
                <input type="text" id="year-founded" name="year_founded"
                    value="{{ user.client.year_founded|default:'' }}" placeholder="e.g., 2020">
            </div>

            <!-- Other -->
            <div>
                <label for="website">Website URL</label>
                <input type="url" id="website" name="website_url" value="{{ user.client.website_url }}"
                    placeholder="https://example.com">
            </div>
            <div>
                <label for="achievements">Achievements</label>
                <textarea id="achievements" name="achievements"
                    placeholder="Key achievements or highlights...">{{ user.client.achievements }}</textarea>
            </div>

            <!-- Dynamic Languages -->
            <div>
                <label>Languages</label>
                <div class="chip-container" id="languages-container"></div>
                <div class="input-group-row">
                    <select id="language-select">
                        <option value="">Select Language to Add...</option>
                        <option value="English">English</option>
                        <option value="Mandarin">Mandarin</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Korean">Korean</option>
                        <option value="Malay">Malay</option>
                        <option value="Hindi">Hindi</option>
                    </select>
                    <button type="button" class="btn-add" onclick="addLanguage()">Add</button>
                </div>
                <input type="hidden" name="languages" id="languages-hidden" value="{{ user.client.languages }}">
            </div>

            <!-- Dynamic Tags -->
            <div>
                <label>Tags</label>
                <div class="chip-container" id="tags-container"></div>
                <div class="input-group-row">
                    <input type="text" id="tag-input" placeholder="Type a tag and press Enter">
                    <button type="button" class="btn-add" onclick="addTag()">Add</button>
                </div>
                <input type="hidden" name="tags" id="tags-hidden" value="{{ user.client.tags }}">
            </div>

            <!-- Social Links -->
            <div>
                <label>Social Links</label>
                <div class="social-links">
                    <div class="social-link">
                        <span>LinkedIn:</span>
                        <input type="url" name="linkedIn_url" value="{{ user.client.linkedIn_url|default:'' }}"
                            placeholder="https://linkedin.com/in/...">
                    </div>
                    <div class="social-link">
                        <span>Instagram:</span>
                        <input type="url" name="instagram_url" value="{{ user.client.instagram_url|default:'' }}"
                            placeholder="https://instagram.com/...">
                    </div>
                    <div class="social-link">
                        <span>Facebook:</span>
                        <input type="url" name="facebook_url" value="{{ user.client.facebook_url|default:'' }}"
                            placeholder="https://facebook.com/...">
                    </div>
                </div>
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</div>

<script>
    // --- Image Preview ---
    document.getElementById('background-image-upload').addEventListener('change', function (e) {
        if (e.target.files[0]) {
            document.querySelector('.banner').src = URL.createObjectURL(e.target.files[0]);
        }
    });
    document.getElementById('profile-image-upload').addEventListener('change', function (e) {
        if (e.target.files[0]) {
            document.querySelector('.profile-image').src = URL.createObjectURL(e.target.files[0]);
        }
    });

    // --- Dynamic Chips Managers ---

    // Languages
    const langContainer = document.getElementById('languages-container');
    const langSelect = document.getElementById('language-select');
    const langHidden = document.getElementById('languages-hidden');
    let languages = langHidden.value ? langHidden.value.split(',').filter(x => x) : [];

    function renderLanguages() {
        langContainer.innerHTML = '';
        languages.forEach((lang, index) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `${lang} <i class="fas fa-times" onclick="removeLanguage(${index})"></i>`;
            langContainer.appendChild(chip);
        });
        langHidden.value = languages.join(',');
    }

    function addLanguage() {
        const val = langSelect.value;
        if (val && !languages.includes(val)) {
            languages.push(val);
            renderLanguages();
            langSelect.value = '';
        }
    }

    window.removeLanguage = function (index) {
        languages.splice(index, 1);
        renderLanguages();
    }

    // Tags
    const tagContainer = document.getElementById('tags-container');
    const tagInput = document.getElementById('tag-input');
    const tagHidden = document.getElementById('tags-hidden');
    let tags = tagHidden.value ? tagHidden.value.split(',').filter(x => x) : [];

    function renderTags() {
        tagContainer.innerHTML = '';
        tags.forEach((tag, index) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML = `${tag} <i class="fas fa-times" onclick="removeTag(${index})"></i>`;
            tagContainer.appendChild(chip);
        });
        tagHidden.value = tags.join(',');
    }

    function addTag() {
        const val = tagInput.value.trim();
        if (val && !tags.includes(val)) {
            tags.push(val);
            renderTags();
            tagInput.value = '';
        }
    }

    window.removeTag = function (index) {
        tags.splice(index, 1);
        renderTags();
    }

    // Handle Enter key for tags
    tagInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Prevent form submission
            addTag();
        }
    });

    // Initial Render
    renderLanguages();
    renderTags();

</script>

{% endblock %}
