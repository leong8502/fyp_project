{% load static %}
{% if user.is_authenticated %}
<style>
    /* ── Ami Chatbox ────────────────────────────────────── */
    #ami-fab {
        position: fixed;
        bottom: 28px;
        right: 28px;
        width: 56px;
        height: 56px;
        background: linear-gradient(135deg, #2e7d32, #43a047);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 18px rgba(46,125,50,.45);
        z-index: 9000;
        transition: transform .2s, box-shadow .2s;
        border: none;
    }
    #ami-fab:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 24px rgba(46,125,50,.6);
    }
    #ami-fab span { font-size: 26px; line-height: 1; }
    #ami-fab .ami-badge {
        position: absolute;
        top: -3px;
        right: -3px;
        background: #e53935;
        color: #fff;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        font-size: 10px;
        font-weight: 700;
        display: none;
        align-items: center;
        justify-content: center;
    }

    #ami-window {
        position: fixed;
        bottom: 96px;
        right: 28px;
        width: 360px;
        max-height: 520px;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 40px rgba(0,0,0,.18);
        display: flex;
        flex-direction: column;
        z-index: 9001;
        overflow: hidden;
        transform: scale(0);
        transform-origin: bottom right;
        transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
        opacity: 0;
    }
    #ami-window.open {
        transform: scale(1);
        opacity: 1;
    }

    #ami-header {
        background: linear-gradient(135deg, #2e7d32, #43a047);
        color: #fff;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    #ami-header .ami-avatar {
        width: 36px;
        height: 36px;
        background: rgba(255,255,255,.25);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
    }
    #ami-header .ami-title { font-weight: 700; font-size: .95rem; }
    #ami-header .ami-sub { font-size: .72rem; opacity: .85; }
    #ami-header .ami-close {
        margin-left: auto;
        cursor: pointer;
        font-size: 20px;
        opacity: .75;
        background: none;
        border: none;
        color: #fff;
    }
    #ami-header .ami-close:hover { opacity: 1; }

    #ami-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f7f8fa;
        scrollbar-width: thin;
    }

    .ami-msg {
        max-width: 85%;
        padding: 10px 13px;
        border-radius: 16px;
        font-size: .87rem;
        line-height: 1.5;
        word-break: break-word;
    }
    .ami-msg.ami { background: #e8f5e9; color: #1b5e20; border-radius: 16px 16px 16px 4px; align-self: flex-start; }
    .ami-msg.user { background: #2e7d32; color: #fff;   border-radius: 16px 16px 4px 16px; align-self: flex-end; }
    .ami-msg.ami a { color: #2e7d32; font-weight: 600; }

    #ami-typing {
        display: none;
        align-self: flex-start;
        padding: 8px 14px;
        background: #e8f5e9;
        border-radius: 16px 16px 16px 4px;
        font-size: .8rem;
        color: #388e3c;
    }
    #ami-typing .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #388e3c;
        margin: 0 2px;
        animation: ami-bounce .9s infinite;
    }
    #ami-typing .dot:nth-child(2) { animation-delay: .15s; }
    #ami-typing .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes ami-bounce {
        0%, 80%, 100% { transform: translateY(0); }
        40%            { transform: translateY(-5px); }
    }

    #ami-input-row {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid #e0e0e0;
        background: #fff;
        flex-shrink: 0;
    }
    #ami-input {
        flex: 1;
        border: 1.5px solid #c8e6c9;
        border-radius: 22px;
        padding: 9px 14px;
        font-size: .87rem;
        outline: none;
        transition: border-color .2s;
    }
    #ami-input:focus { border-color: #2e7d32; }
    #ami-send {
        background: linear-gradient(135deg, #2e7d32, #43a047);
        border: none;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #fff;
        font-size: 16px;
        flex-shrink: 0;
        transition: transform .15s;
    }
    #ami-send:hover { transform: scale(1.1); }

    @media (max-width: 480px) {
        #ami-window { width: calc(100vw - 24px); right: 12px; bottom: 80px; }
        #ami-fab { right: 16px; bottom: 16px; }
    }
</style>

<!-- Floating button -->
<button id="ami-fab" onclick="amiToggle()" aria-label="Open Ami chatbox">
    <span>💬</span>
</button>

<!-- Chat window -->
<div id="ami-window" role="dialog" aria-label="Ami Chatbox">
    <div id="ami-header">
        <div class="ami-avatar">🤖</div>
        <div>
            <div class="ami-title">Ami</div>
            <div class="ami-sub">TalentSync Assistant</div>
        </div>
        <button class="ami-close" onclick="amiToggle()" aria-label="Close">✕</button>
    </div>

    <div id="ami-messages">
        <!-- messages injected here -->
        <div id="ami-typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>

    <div id="ami-input-row">
        <input id="ami-input" type="text" placeholder="Ask Ami anything…" autocomplete="off"
               onkeydown="if(event.key==='Enter')amiSend()">
        <button id="ami-send" onclick="amiSend()" aria-label="Send">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
(function () {
    const GREETINGS = [
        "Hi there! I'm Ami, your TalentSync assistant 😊 How can I help you today?",
        "Hello! Great to see you! I'm Ami – ask me anything about TalentSync 🌟",
        "Hey! I'm Ami, here to help you navigate TalentSync. What's on your mind?",
        "Welcome back! I'm Ami 👋 How can I assist you today?",
        "Good to see you! I'm Ami – your personal TalentSync guide. What do you need?",
    ];

    let opened = false;   // have we shown the greeting this session?
    const CSRF = '{{ csrf_token }}';

    /** Toggle chat window open / closed */
    window.amiToggle = function () {
        const win = document.getElementById('ami-window');
        win.classList.toggle('open');
        if (win.classList.contains('open') && !opened) {
            opened = true;
            loadHistory();
        }
        document.getElementById('ami-input').focus();
    };

    /** Add a message bubble */
    function addMsg(text, who) {
        const box   = document.getElementById('ami-messages');
        const typing = document.getElementById('ami-typing');
        const div   = document.createElement('div');
        div.className = `ami-msg ${who}`;
        div.innerHTML = text;          // allow HTML links from Ami
        box.insertBefore(div, typing);
        box.scrollTop = box.scrollHeight;
    }

    /** Show / hide typing indicator */
    function setTyping(show) {
        const t = document.getElementById('ami-typing');
        t.style.display = show ? 'flex' : 'none';
        if (show) {
            const box = document.getElementById('ami-messages');
            box.scrollTop = box.scrollHeight;
        }
    }

    /** Load history from server then show greeting if empty */
    function loadHistory() {
        fetch('{% url "ami_history" %}', { credentials: 'same-origin' })
            .then(r => r.json())
            .then(data => {
                if (data.history && data.history.length > 0) {
                    data.history.forEach(function (h) {
                        addMsg(h.message, 'user');
                        addMsg(h.response, 'ami');
                    });
                } else {
                    // Fresh session — show a random greeting
                    const greet = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
                    addMsg(greet, 'ami');
                }
            })
            .catch(function () {
                const greet = GREETINGS[Math.floor(Math.random() * GREETINGS.length)];
                addMsg(greet, 'ami');
            });
    }

    /** Send a message */
    window.amiSend = function () {
        const input = document.getElementById('ami-input');
        const msg   = input.value.trim();
        if (!msg) return;
        input.value = '';

        addMsg(msg, 'user');
        setTyping(true);

        const form = new FormData();
        form.append('message', msg);
        form.append('csrfmiddlewaretoken', CSRF);

        fetch('{% url "ami_ask" %}', {
            method: 'POST',
            body: form,
            credentials: 'same-origin',
        })
        .then(r => r.json())
        .then(function (data) {
            setTyping(false);
            addMsg(data.response || "Oops! Something went wrong.", 'ami');
        })
        .catch(function () {
            setTyping(false);
            addMsg("Hmm, I couldn't reach the server. Please try again!", 'ami');
        });
    };
})();
</script>
{% endif %}
