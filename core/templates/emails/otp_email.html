<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; color: #333; line-height: 1.6; }
        .container { max-width: 600px; margin: 40px auto; padding: 30px; border-radius: 12px; border: 1px solid #eee; background: white; text-align: center; }
        .code { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: #007bff; margin: 20px 0; background: #f0f9ff; padding: 15px; border-radius: 8px; display: inline-block; }
        .footer { font-size: 12px; color: #888; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body style="background: #fafafa; padding: 20px;">
    <div class="container">
        <h2 style="color: #1e293b; margin-top: 0;">Verify your email</h2>
        <p>Thank you for starting your registration with TalentSync. Please use the following 6-digit code to verify your email address. This code is valid for 10 minutes.</p>
        
        <div class="code">{{ otp }}</div>
        
        <p>If you didn't request this verification, please ignore this email.</p>
        
        <div class="footer">
            &copy; 2026 TalentSync Platform
        </div>
    </div>
</body>
</html>
