{% extends 'core/master.html' %}
{% load static %}

{% block title %}Reset Password{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/css/login.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-card">
        <div class="form-container">
            <h1>Reset Password</h1>
            <p class="subtitle">Enter your email address to receive a reset link</p>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_email">Email Address</label>
                    <input type="email" name="email" id="id_email" placeholder="example@email.com" required>
                </div>

                <button type="submit" class="btn-login">Send Reset Link</button>
            </form>

            <div class="signup-link">
                Remember your password? <a href="{% url 'login' %}">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
