{% extends 'core/master.html' %}
{% load static %}

{% block title %}Reset Complete{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'core/css/login.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-card">
        <div class="form-container" style="text-align: center;">
            <div style="margin-bottom: 20px; color: #10b981;">
                <i class="fas fa-check-circle fa-4x"></i>
            </div>
            <h1>Password Reset Complete</h1>
            <p class="subtitle">Your password has been successfully reset. You can now log in with your new password.
            </p>

            <a href="{% url 'login' %}" class="btn-login"
                style="text-align: center; display: block; text-decoration: none; margin-top: 30px; width: auto;">Log In
                Now</a>
        </div>
    </div>
</div>
{% endblock %}
